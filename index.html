<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affordable Data Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #ffcc00;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      color: #111;
    }

    header p {
      margin-top: 8px;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .package {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .package:hover {
      border-color: #ffcc00;
    }

    .package input {
      margin-right: 10px;
    }

    .price {
      font-weight: bold;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input[type="tel"],
    input[type="email"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Affordable Data Hub</h1>
    <p>Fast & Affordable MTN Data Bundles</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Choose Your MTN Data</h2>

      <label class="package">
        <span>
          <input type="radio" name="bundle" value="1GB" data-price="5">
          1GB
        </span>
        <span class="price">GH₵5</span>
      </label>

      <label class="package">
        <span>
          <input type="radio" name="bundle" value="2GB" data-price="10">
          2GB
        </span>
        <span class="price">GH₵10</span>
      </label>

      <label class="package">
        <span>
          <input type="radio" name="bundle" value="3GB" data-price="15">
          3GB
        </span>
        <span class="price">GH₵15</span>
      </label>

      <label class="package">
        <span>
          <input type="radio" name="bundle" value="5GB" data-price="25">
          5GB
        </span>
        <span class="price">GH₵25</span>
      </label>

      <label class="package">
        <span>
          <input type="radio" name="bundle" value="10GB" data-price="50">
          10GB
        </span>
        <span class="price">GH₵50</span>
      </label>

      <label for="phone">MTN Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="024 XXXXXXX"
        maxlength="10"
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
      >

      <button onclick="payForData()">
        Pay for Data
      </button>

      <div id="message"></div>
    </div>

  </div>

  <footer>
    © 2026 Affordable Data Hub
  </footer>

  <script>
    function payForData() {

      const bundle = document.querySelector(
        'input[name="bundle"]:checked'
      );

      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message");

      if (!bundle) {
        message.textContent = "Please select a data bundle.";
        return;
      }

      if (!/^0[235679][0-9]{8}$/.test(phone)) {
        message.textContent = "Please enter a valid Ghana phone number.";
        return;
      }

      if (!email || !email.includes("@")) {
        message.textContent = "Please enter a valid email.";
        return;
      }

      const packageName = bundle.value;
      const price = bundle.dataset.price;

      message.textContent =
        "Selected " + packageName +
        " for GH₵" + price +
        ". Payment connection coming next.";
    }
  </script>

</body>
</html>
