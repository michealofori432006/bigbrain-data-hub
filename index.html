<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bigbrain Data Hub</title>
  <!-- Paystack -->
  <script src="https://js.paystack.co/v2/inline.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background: #f5f7fa;
      color: #111;
    }
    header {
      background: #008751;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }
    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    header p {
      font-size: 15px;
    }
    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 0 18px;
    }
    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }
    h2 {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #008751;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #006f42;
    }
    .info {
      background: #e9f8f0;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      line-height: 1.5;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
<header>
  <h1>Bigbrain Data Hub</h1>
  <p>Affordable MTN Data Bundles</p>
</header>
<div class="container">
  <div class="card">
    <h2>Place Your Order</h2>
    <label>Your Name</label>
    <input type="text" id="name" placeholder="Enter your name">
    <label>MTN Phone Number</label>
    <input type="tel" id="phone" placeholder="024XXXXXXX">
    <label>Select Data Bundle</label>
    <select id="bundle">
      <option value="">Choose a bundle</option>
      <option value="1GB" data-price="5">1GB — GH₵5</option>
      <option value="2GB" data-price="9">2GB — GH₵9</option>
      <option value="3GB" data-price="13">3GB — GH₵13</option>
      <option value="5GB" data-price="20">5GB — GH₵20</option>
      <option value="10GB" data-price="35">10GB — GH₵35</option>
      <option value="20GB" data-price="60">20GB — GH₵60</option>
    </select>
    <button onclick="payNow()">Pay for Data</button>
    <div class="info">
      <strong>How it works:</strong><br>
      1. Enter your name and MTN number.<br>
      2. Select your data bundle.<br>
      3. Pay securely through Paystack.<br>
      4. Your order is manually processed.
    </div>
  </div>
</div>
<footer>
  © 2026 Bigbrain Data Hub
</footer>
<script>
  /*
   =====================================================
   YOUR PAYSTACK LIVE PUBLIC KEY GOES HERE
   =====================================================
   Replace ONLY the text between the quotation marks.
   Example:
   const PAYSTACK_PUBLIC_KEY = "pk_live_xxxxxxxxxxxxx";
   NEVER put your Paystack SECRET KEY here.
   =====================================================
  */
  const PAYSTACK_PUBLIC_KEY = "PASTE_YOUR_LIVE_PUBLIC_KEY_HERE";
  function payNow() {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const bundleSelect = document.getElementById("bundle");
    const selectedOption =
      bundleSelect.options[bundleSelect.selectedIndex];
    const bundle = selectedOption.value;
    const price = selectedOption.getAttribute("data-price");
    if (!name || !phone || !bundle || !price) {
      alert("Please complete all fields.");
      return;
    }
    if (PAYSTACK_PUBLIC_KEY === "PASTE_YOUR_LIVE_PUBLIC_KEY_HERE") {
      alert("Paystack has not been connected yet.");
      return;
    }
    /*
      IMPORTANT:
      This opens Paystack's checkout.
      The secure backend/payment verification
      will be added before you accept real customer
      orders.
    */
    const paystack = new PaystackPop();
    paystack.newTransaction({
      key:pk_live_4f1103c282de7db8097a0934c079c6fa01cbe8ce,
      email: "customer@example.com",
      amount: Number(price) * 100,
      currency: "GHS",
      onSuccess: function(transaction) {
        const message =
          "Hello Bigbrain Data Hub,%0A%0A" +
          "PAYMENT SUCCESSFUL%0A" +
          "Name: " + encodeURIComponent(name) + "%0A" +
          "MTN Number: " + encodeURIComponent(phone) + "%0A" +
          "Bundle: " + encodeURIComponent(bundle) + "%0A" +
          "Amount: GH₵" + encodeURIComponent(price) + "%0A" +
          "Reference: " + encodeURIComponent(transaction.reference);
        window.location.href =
          "https://wa.me/233545977497?text=" + message;
      },
      onCancel: function() {
        alert("Payment cancelled.");
      }
    });
  }
</script>
</body>
</html>
